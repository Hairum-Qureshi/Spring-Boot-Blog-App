# ==========================================
# DATABASE
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# ==========================================
# DEVELOPMENT LOGGING
# ==========================================
spring.output.ansi.enabled=always
logging.level.org.springframework.security=TRACE
# ==========================================
# JWT COOKIES
# ==========================================
security.jwt.secure=false
security.jwt.cookie-http-only=true
# ==========================================
# FRONTEND URL
# ==========================================
app.auth.frontend.success-redirect=http://localhost:5173/auth/success
app.auth.frontend.failure-redirect=http://localhost:5173/auth/failure