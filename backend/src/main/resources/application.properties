# ==========================================
# App Name
# ==========================================
spring.application.name=Blog-App
# ==========================================
# DATABASE
# ==========================================
spring.datasource.url=${DATABASE_URL}
# ==========================================
# GOOGLE OAUTH2
# ==========================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
# ==========================================
# JWT
# ==========================================
security.jwt.secret-key=${JWT_SECRET_KEY}
security.jwt.issuer=com.example.Blog_App
security.jwt.access-ttl-seconds=3600
security.jwt.refresh-ttl-seconds=604800
security.jwt.cookie-same-site=Lax
# ==========================================
# JWT COOKIES
# ==========================================
security.jwt.refresh-token-cookie-name=refreshToken